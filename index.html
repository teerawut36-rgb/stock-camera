<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>สแกน Barcode</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: white;
  font-family: Arial, "Noto Sans Thai", sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.message {
  text-align: center;
  color: #cbd5e1;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 16px;
  background: #000;
}

button {
  width: 100%;
  min-height: 60px;
  margin-top: 15px;
  border: none;
  border-radius: 14px;
  font-size: 20px;
  font-weight: bold;
  color: white;
}

#startButton {
  background: #16a34a;
}

#closeButton {
  background: #dc2626;
}

.status {
  margin-top: 20px;
  padding: 15px;
  background: #1f2937;
  border-radius: 12px;
  text-align: center;
  line-height: 1.6;
}

.success {
  background: #14532d;
}

.error {
  background: #7f1d1d;
}

</style>

</head>


<body>

<div class="container">

  <h1>📷 สแกน Barcode</h1>

  <div class="message">
    กดปุ่มด้านล่างเพื่ออนุญาตและเปิดกล้อง
  </div>


  <button
    id="startButton"
    type="button"
  >
    📷 เริ่มเปิดกล้อง
  </button>


  <div id="reader"></div>


  <div
    class="status"
    id="status"
  >
    กรุณากด “เริ่มเปิดกล้อง”
  </div>


  <button
    id="closeButton"
    type="button"
    onclick="closeScanner()"
  >
    ✖ ยกเลิก
  </button>

</div>


<script>

let html5QrCode = null;

let scannerStarted = false;


const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get('returnUrl');


function setStatus(message, type) {

  const status =
    document.getElementById('status');

  status.textContent = message;

  status.className =
    'status ' + (type || '');

}


document
  .getElementById('startButton')
  .addEventListener('click', startScanner);


async function startScanner() {

  const startButton =
    document.getElementById('startButton');

  startButton.disabled = true;

  startButton.textContent =
    'กำลังเปิดกล้อง...';


  setStatus(
    'กำลังขออนุญาตใช้กล้อง กรุณากด “อนุญาต” เมื่อระบบถาม',
    ''
  );


  try {

    html5QrCode =
      new Html5Qrcode('reader');


    const config = {
      fps: 10,
      qrbox: {
        width: 280,
        height: 180
      },
      aspectRatio: 1.777778
    };


    // พยายามเปิดกล้องหลัง
    try {

      await html5QrCode.start(
        {
          facingMode: {
            exact: 'environment'
          }
        },
        config,
        onScanSuccess,
        onScanFailure
      );

    } catch (firstError) {

      // ถ้าเครื่องไม่มี environment
      await html5QrCode.start(
        {
          facingMode: 'environment'
        },
        config,
        onScanSuccess,
        onScanFailure
      );

    }


    scannerStarted = true;


    setStatus(
      '✓ เปิดกล้องแล้ว กรุณานำ Barcode มาไว้ในกรอบสแกน',
      'success'
    );


    startButton.style.display =
      'none';


  } catch (error) {

    console.error(error);

    startButton.disabled = false;

    startButton.textContent =
      '📷 ลองเปิดกล้องอีกครั้ง';


    setStatus(
      '❌ ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบว่าอนุญาตให้ Safari ใช้กล้องแล้ว',
      'error'
    );

  }

}


function onScanSuccess(decodedText) {

  if (!decodedText) {
    return;
  }


  if (!scannerStarted) {
    return;
  }


  scannerStarted = false;


  setStatus(
    '✓ สแกนสำเร็จ: ' + decodedText,
    'success'
  );


  if (html5QrCode) {

    html5QrCode
      .stop()
      .then(function() {

        returnBarcode(decodedText);

      })
      .catch(function() {

        returnBarcode(decodedText);

      });

  } else {

    returnBarcode(decodedText);

  }

}


function onScanFailure(error) {
  // ไม่ต้องแสดง Error ทุกเฟรม
}


function returnBarcode(barcode) {

  if (!returnUrl) {

    setStatus(
      'ไม่พบ URL สำหรับกลับไปหน้านับ',
      'error'
    );

    return;
  }


  const separator =
    returnUrl.includes('?')
      ? '&'
      : '?';


  const targetUrl =
    returnUrl +
    separator +
    'barcode=' +
    encodeURIComponent(barcode);


  window.location.href =
    targetUrl;

}


function closeScanner() {

  if (html5QrCode && scannerStarted) {

    html5QrCode
      .stop()
      .catch(function() {})
      .finally(function() {
        goBack();
      });

  } else {

    goBack();

  }

}


function goBack() {

  if (returnUrl) {
    window.location.href = returnUrl;
  } else {
    window.history.back();
  }

}

</script>

</body>
</html>
