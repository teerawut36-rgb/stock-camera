<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>สแกนบาร์โค้ดสินค้า</title>


  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #172033;
      color: white;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 12px;
    }

    #status {
      text-align: center;
      padding: 15px;
      background: #243044;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 14px;
      overflow: hidden;
    }

    .manual {
      margin-top: 20px;
      padding: 16px;
      background: #243044;
      border-radius: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: 0;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .send {
      background: #16a34a;
      color: white;
    }

    .close {
      background: #dc2626;
      color: white;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    📷 สแกนบาร์โค้ดสินค้า
  </h1>


  <div id="status">
    กำลังเตรียมกล้อง...
  </div>


  <div id="reader"></div>


  <div class="manual">

    <label>
      หากสแกนไม่ได้ สามารถกรอกรหัสเอง
    </label>


    <input
      type="text"
      id="manualBarcode"
      placeholder="กรอกรหัสสินค้า"
      autocomplete="off"
    >


    <button
      class="send"
      type="button"
      onclick="sendManualBarcode()"
    >
      ส่งรหัสสินค้า
    </button>

  </div>


  <button
    class="close"
    type="button"
    onclick="closeCamera()"
  >
    ปิดกล้อง
  </button>

</div>


<script>

let scanner = null;
let scanned = false;


const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get('returnUrl');


/**
 * เริ่มกล้อง
 */
async function startScanner() {

  const status =
    document.getElementById('status');


  try {

    status.textContent =
      '📷 กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง';


    scanner =
      new Html5Qrcode('reader');


    await scanner.start(

      {
        facingMode: {
          ideal: 'environment'
        }
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const width =
            Math.min(
              viewfinderWidth * 0.9,
              350
            );

          const height =
            Math.min(
              viewfinderHeight * 0.5,
              180
            );

          return {
            width: width,
            height: height
          };

        }

      },

      onScanSuccess,

      function() {}

    );


    status.textContent =
      '📦 หันกล้องไปที่บาร์โค้ดสินค้า';


  } catch (error) {

    console.error(error);


    status.textContent =
      '❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง';

  }

}


/**
 * เมื่อสแกนสำเร็จ
 */
async function onScanSuccess(decodedText) {

  if (scanned) {
    return;
  }


  scanned = true;


  document
    .getElementById('status')
    .textContent =
    '✅ สแกนสำเร็จ กำลังกลับหน้าจอนับ...';


  await stopScanner();


  setTimeout(function() {

    returnToStockPage(
      decodedText
    );

  }, 500);

}


/**
 * กรอกรหัสเอง
 */
function sendManualBarcode() {

  const barcode =
    document
      .getElementById('manualBarcode')
      .value
      .trim();


  if (!barcode) {

    alert(
      'กรุณากรอกรหัสสินค้า'
    );

    return;

  }


  scanned = true;


  stopScanner()
    .finally(function() {

      returnToStockPage(
        barcode
      );

    });

}


/**
 * กลับหน้าระบบนับ
 */
function returnToStockPage(barcode) {

  if (!returnUrl) {

    document
      .getElementById('status')
      .textContent =
      '❌ ไม่พบ URL สำหรับกลับหน้าระบบนับ';

    return;

  }


  const separator =
    returnUrl.includes('?')
      ? '&'
      : '?';


  const targetUrl =
    returnUrl +
    separator +
    'barcode=' +
    encodeURIComponent(
      String(barcode).trim()
    );


  window.location.replace(
    targetUrl
  );

}


/**
 * หยุดกล้อง
 */
async function stopScanner() {

  try {

    if (scanner) {

      await scanner.stop();

      scanner.clear();

    }

  } catch (error) {

    console.log(error);

  }

}


/**
 * ปิดกล้อง
 */
async function closeCamera() {

  await stopScanner();


  if (returnUrl) {

    window.location.href =
      returnUrl;

  } else {

    window.history.back();

  }

}


/**
 * เริ่ม
 */
window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
