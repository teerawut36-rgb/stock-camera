<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>สแกน Barcode</title>


  <!-- Library สำหรับสแกน Barcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #162033;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
    }

    .instruction {
      text-align: center;
      color: #c6d1e0;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: #29364a;
      border-radius: 14px;
      text-align: center;
      font-size: 17px;
    }

    .manual-box {
      margin-top: 18px;
      background: #29364a;
      border-radius: 18px;
      padding: 18px;
    }

    input {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px;
      margin-top: 12px;
      font-size: 19px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .manual-button {
      background: #229b4b;
    }

    .back-button {
      background: #e52424;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 สแกน Barcode สินค้า</h1>

  <div class="instruction">
    กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง<br>
    แล้วหันกล้องไปที่ Barcode สินค้า
  </div>


  <div id="reader"></div>


  <div
    class="status"
    id="status"
  >
    ⏳ กำลังเตรียมกล้อง...
  </div>


  <div class="manual-box">

    <strong>
      หากสแกนไม่ได้ สามารถกรอกรหัสสินค้าเอง
    </strong>

    <input
      type="text"
      id="manualBarcode"
      placeholder="กรอก Barcode / รหัสสินค้า"
    >

    <button
      class="manual-button"
      onclick="submitManualBarcode()"
    >
      ส่งรหัสสินค้า
    </button>

  </div>


  <button
    class="back-button"
    onclick="goBack()"
  >
    ← กลับหน้าระบบนับสต๊อก
  </button>

</div>


<script>

  let html5QrCode = null;

  let scanned = false;


  /**
   * อ่าน returnUrl ที่ Apps Script ส่งมา
   */
  function getReturnUrl() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get('returnUrl');
  }


  /**
   * เมื่อสแกนสำเร็จ
   */
  function onScanSuccess(decodedText) {

    if (scanned) {
      return;
    }

    scanned = true;

    document
      .getElementById('status')
      .textContent =
      '✅ สแกนสำเร็จ: ' + decodedText;


    if (html5QrCode) {

      html5QrCode
        .stop()
        .catch(function(error) {
          console.log(error);
        });

    }


    setTimeout(
      function() {
        returnBarcode(decodedText);
      },
      500
    );
  }


  /**
   * ส่ง Barcode กลับ Apps Script
   */
  function returnBarcode(barcode) {

    const returnUrl =
      getReturnUrl();


    if (!returnUrl) {

      document
        .getElementById('status')
        .textContent =
        '❌ ไม่พบ URL สำหรับกลับหน้าระบบ';

      scanned = false;

      return;
    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    const targetUrl =
      returnUrl +
      separator +
      'barcode=' +
      encodeURIComponent(barcode);


    window.location.href =
      targetUrl;
  }


  /**
   * กรอกรหัสเอง
   */
  function submitManualBarcode() {

    const barcode =
      document
        .getElementById('manualBarcode')
        .value
        .trim();


    if (!barcode) {

      alert(
        'กรุณากรอกรหัสสินค้า'
      );

      return;
    }


    returnBarcode(barcode);
  }


  /**
   * กลับหน้าระบบ
   */
  function goBack() {

    const returnUrl =
      getReturnUrl();


    if (returnUrl) {

      window.location.href =
        returnUrl;

    } else {

      window.history.back();

    }
  }


  /**
   * เริ่มกล้อง
   */
  async function startScanner() {

    const status =
      document.getElementById('status');


    try {

      status.textContent =
        '📷 กำลังขออนุญาตใช้กล้อง...';


      html5QrCode =
        new Html5Qrcode('reader');


      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'ไม่พบกล้องบนอุปกรณ์นี้'
        );

      }


      let cameraId =
        cameras[0].id;


      // เลือกกล้องหลัง ถ้ามี
      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ''
          ).toLowerCase();


        if (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        ) {

          cameraId =
            cameras[i].id;

          break;
        }
      }


      await html5QrCode.start(
        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 150
          },

          aspectRatio: 1.7778
        },

        onScanSuccess,

        function() {
          // ไม่ต้องแสดง Error ทุกครั้งที่ยังไม่พบ Barcode
        }
      );


      status.textContent =
        '📷 กล้องพร้อมแล้ว กรุณาสแกน Barcode';


    } catch (error) {

      console.error(error);


      status.innerHTML =
        '❌ ไม่สามารถเปิดกล้องได้<br><br>' +
        'กรุณากดอนุญาตให้เว็บไซต์ใช้กล้อง<br>' +
        'หรือกรอกรหัสสินค้าด้านล่าง';


      console.log(
        'Camera Error:',
        error
      );

    }
  }


  /**
   * เริ่มเมื่อเปิดหน้า
   */
  window.addEventListener(
    'load',
    function() {

      startScanner();

    }
  );

</script>

</body>
</html>
