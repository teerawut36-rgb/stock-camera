<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>สแกน Barcode</title>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 24px;
}

p {
  text-align: center;
  color: #CBD5E1;
}

#reader {
  width: 100%;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  margin-top: 20px;
}

.status {
  margin-top: 15px;
  padding: 15px;
  background: #1E293B;
  border-radius: 12px;
  text-align: center;
}

.manual-box {
  margin-top: 20px;
  padding: 18px;
  background: #1E293B;
  border-radius: 15px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  border: none;
  font-size: 18px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}

.btn-send {
  background: #16A34A;
  color: white;
}

.btn-close {
  background: #DC2626;
  color: white;
}

</style>

</head>


<body>

<div class="container">

  <h1>📷 สแกน Barcode</h1>

  <p>
    กรุณาอนุญาตให้เว็บไซต์ใช้กล้องเมื่อ iPhone แสดงข้อความขอสิทธิ์
  </p>


  <div id="reader"></div>


  <div id="status" class="status">
    กำลังเตรียมกล้อง...
  </div>


  <div class="manual-box">

    <strong>กรณีกล้องสแกนไม่ได้ สามารถกรอกรหัสสินค้าได้</strong>

    <input
      id="manualBarcode"
      type="text"
      placeholder="กรอกรหัสสินค้า"
      autocomplete="off"
    >


    <button
      class="btn-send"
      onclick="sendManualBarcode()"
    >
      ส่งรหัสสินค้า
    </button>


    <button
      class="btn-close"
      onclick="closeCameraPage()"
    >
      กลับหน้าระบบนับ
    </button>

  </div>

</div>


<script>

let html5QrCode = null;

let scannerStarted = false;

let scanned = false;


/**
 * อ่าน URL
 */
const params =
  new URLSearchParams(
    window.location.search
  );


const RETURN_URL =
  params.get('returnUrl');


/**
 * เริ่มกล้อง
 */
async function startScanner() {

  const status =
    document.getElementById('status');


  if (!RETURN_URL) {

    status.innerHTML =
      '❌ ไม่พบ URL สำหรับกลับไปหน้าระบบนับ';

    return;
  }


  try {

    status.innerHTML =
      '📷 กำลังเปิดกล้อง...';


    html5QrCode =
      new Html5Qrcode('reader');


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      status.innerHTML =
        '❌ ไม่พบกล้องบนอุปกรณ์นี้';

      return;
    }


    let selectedCamera =
      cameras[0].id;


    // พยายามเลือกกล้องหลัง
    const backCamera =
      cameras.find(function(camera) {

        const label =
          String(camera.label || '')
            .toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        );

      });


    if (backCamera) {
      selectedCamera = backCamera.id;
    }


    await html5QrCode.start(

      selectedCamera,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 150
        },

        aspectRatio: 1.7778
      },

      onScanSuccess,

      function() {
        // ไม่ต้องทำอะไรเมื่อยังอ่าน Barcode ไม่ได้
      }

    );


    scannerStarted = true;


    status.innerHTML =
      '✅ เปิดกล้องแล้ว กรุณาหันกล้องไปที่ Barcode';


  } catch (error) {

    console.error(error);


    status.innerHTML =
      '❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง หรือกรอกรหัสสินค้าด้านล่าง';


    scannerStarted = false;
  }
}


/**
 * เมื่อสแกนสำเร็จ
 */
function onScanSuccess(decodedText) {

  if (scanned) {
    return;
  }


  scanned = true;


  document.getElementById('status').innerHTML =
    '✅ สแกนสำเร็จ: ' + decodedText;


  if (
    html5QrCode &&
    scannerStarted
  ) {

    html5QrCode
      .stop()
      .catch(function(error) {
        console.log(error);
      });

  }


  setTimeout(function() {

    returnToStockPage(decodedText);

  }, 400);

}


/**
 * ส่ง Barcode กลับ Apps Script
 */
function returnToStockPage(barcode) {

  if (!RETURN_URL) {

    alert('ไม่พบ URL สำหรับกลับไปหน้าระบบนับ');

    return;
  }


  const separator =
    RETURN_URL.includes('?')
      ? '&'
      : '?';


  window.location.href =
    RETURN_URL +
    separator +
    'barcode=' +
    encodeURIComponent(
      String(barcode).trim()
    );

}


/**
 * ส่งรหัสที่กรอกเอง
 */
function sendManualBarcode() {

  const barcode =
    document
      .getElementById('manualBarcode')
      .value
      .trim();


  if (!barcode) {

    alert('กรุณากรอกรหัสสินค้า');

    return;
  }


  returnToStockPage(barcode);
}


/**
 * กลับหน้าระบบนับ
 */
function closeCameraPage() {

  if (RETURN_URL) {

    window.location.href =
      RETURN_URL;

  } else {

    window.history.back();

  }

}


/**
 * เริ่มทำงาน
 */
window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
