<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>สแกน Barcode</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
}

#reader {
  width: 100%;
  margin-top: 15px;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

.message {
  text-align: center;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  background: #243247;
}

button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
}

.green {
  background: #13a64b;
  color: white;
}

.red {
  background: #e3222a;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>📷 สแกน Barcode</h1>

<div
  id="message"
  class="message"
>
กำลังเตรียมกล้อง...
</div>

<div id="reader"></div>

<input
  id="manual"
  type="text"
  placeholder="กรอก Barcode เองกรณีสแกนไม่ได้"
>

<button
  class="green"
  onclick="manualSearch()"
>
ค้นหารหัสสินค้า
</button>

<button
  class="red"
  onclick="backToSystem()"
>
กลับหน้าระบบนับ
</button>

</div>


<script>

let scanner = null;

let returnUrl = '';

let alreadyScanned = false;


/************************************************
 * LOAD
 ************************************************/
window.addEventListener(
  'load',
  function() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    returnUrl =
      params.get('return') || '';

    startScanner();

  }
);


/************************************************
 * START CAMERA
 ************************************************/
function startScanner() {

  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 160
    },

    aspectRatio: 1.7777778

  };


  scanner
    .start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      config,

      onScanSuccess,

      function(errorMessage) {
        // ไม่ต้องแสดง error ทุกเฟรม
      }

    )

    .then(
      function() {

        setMessage(
          '🟢 เปิดกล้องแล้ว กรุณาหันกล้องไปที่ Barcode'
        );

      }
    )

    .catch(
      function(error) {

        /*
         * ลองแบบ environment อีกครั้ง
         */
        scanner
          .start(
            {
              facingMode: 'environment'
            },

            config,

            onScanSuccess,

            function() {}
          )

          .then(
            function() {

              setMessage(
                '🟢 เปิดกล้องแล้ว กรุณาสแกน Barcode'
              );

            }
          )

          .catch(
            function(err) {

              setMessage(
                '❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้เว็บไซต์เข้าถึงกล้อง'
              );

              console.error(err);
            }
          );
      }
    );
}


/************************************************
 * SCAN SUCCESS
 ************************************************/
function onScanSuccess(
  decodedText
) {

  if (alreadyScanned) {
    return;
  }

  alreadyScanned = true;


  const barcode =
    String(decodedText)
      .trim();


  setMessage(
    '✅ สแกนได้: ' +
    barcode
  );


  if (scanner) {

    scanner
      .stop()
      .catch(
        function() {}
      );
  }


  /*
   * กลับ Apps Script
   */
  goBack(
    barcode
  );
}


/************************************************
 * MANUAL
 ************************************************/
function manualSearch() {

  const barcode =
    document
      .getElementById(
        'manual'
      )
      .value
      .trim();


  if (!barcode) {

    setMessage(
      'กรุณากรอก Barcode'
    );

    return;
  }


  goBack(
    barcode
  );
}


/************************************************
 * BACK
 ************************************************/
function goBack(
  barcode
) {

  if (!returnUrl) {

    setMessage(
      'ไม่พบ URL สำหรับกลับหน้าระบบ'
    );

    return;
  }


  const separator =
    returnUrl.includes('?')
      ? '&'
      : '?';


  window.location.href =
    returnUrl +
    separator +
    'barcode=' +
    encodeURIComponent(
      barcode
    );
}


/************************************************
 * BACK WITHOUT BARCODE
 ************************************************/
function backToSystem() {

  if (!returnUrl) {

    window.history.back();

    return;
  }


  window.location.href =
    returnUrl;
}


/************************************************
 * MESSAGE
 ************************************************/
function setMessage(
  text
) {

  document
    .getElementById(
      'message'
    )
    .textContent =
    text;
}

</script>

</body>
</html>
